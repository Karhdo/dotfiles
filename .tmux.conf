# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Pinned: v5+ is a rewrite that changes the look and adds key bindings
set -g @plugin 'fabioluciano/tmux-tokyo-night#v1.11.0'
set -g @theme_transparent_status_bar 'true'
set -g @theme_plugins 'datetime,weather'
set -g @theme_plugin_datetime_format '%a %d %b %H:%M'
set -g @theme_plugin_weather_location 'Ho Chi Minh'
# Claude Code in popups; key bindings are after the tpm run line
set -g @plugin 'craftzdog/tmux-claude-hatch'
set -g @claude_args '--dangerously-skip-permissions'
# Wrapper that drops to a shell when Claude exits, so the session survives
set -g @claude_command "$HOME/.config/tmux/claude.sh"
# Picker (prefix+u) enter: open the chosen Claude here instead of switching session
set -g @claude_fzf_options "--bind 'enter:become($HOME/.config/tmux/claude-pick.sh {})'"

# Improve colors
set -g default-terminal 'screen-256color'
# Pass 24-bit true color through to WezTerm (otherwise hex colors get rounded to 256)
set -as terminal-features ',xterm-256color:RGB'

# Set scrollback buffer to 10000
set -g history-limit 10000

# Change action key
unbind C-b
set-option -g prefix C-t

# Switch panes
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R

# Resize panes
bind  -r C-k resize-pane -U 5
bind  -r C-j resize-pane -D 5
bind  -r C-h resize-pane -L 5
bind  -r C-l resize-pane -R 5

# Renumber windows to close gaps left by closed ones (0, 2, 5 -> 0, 1, 2):
# automatically whenever a window closes, or on demand with prefix+N
set -g renumber-windows on
bind-key N move-window -r \; display-message "Windows renumbered"

# Enabling the mouse mode
setw -g mouse on

# Run Tmux Plugin Manager
run '~/.tmux/plugins/tpm/tpm'

# Claude popups, bound after tpm so y overrides the plugin's (prefix+u, the
# picker, and prefix+d, hide, stay as they are):
#   prefix+y: open Claude for the current dir in this tmux session's popup.
#   prefix+r: reopen the popup used last, on the Claude that was showing.
#   prefix+F: same as r, but full size; inside a popup, toggles full/normal size.
bind-key y run-shell "$HOME/.config/tmux/claude-popup.sh '#{q:session_path}' '#{q:pane_current_path}' '#{q:window_id}'"
bind-key r run-shell "$HOME/.config/tmux/claude-recent.sh '#{q:window_id}'"
bind-key F run-shell "$HOME/.config/tmux/claude-recent.sh '#{q:window_id}' --full"

# Reload config
bind-key R source-file ~/.tmux.conf \; display-message "Config successfully reloaded"
