# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
# Claude Code in per-project popups: prefix+y open, prefix+d hide, prefix+u picker
set -g @plugin 'craftzdog/tmux-claude-hatch'
set -g @claude_args '--dangerously-skip-permissions'
# Wrapper that drops to a shell when Claude exits, so the session survives
set -g @claude_command "$HOME/.config/tmux/claude.sh"

# Improve colors
set -g default-terminal 'screen-256color'
# Pass 24-bit true color through to WezTerm (otherwise hex colors get rounded to 256)
set -as terminal-features ',xterm-256color:RGB'

# Set scrollback buffer to 10000
set -g history-limit 10000

# Change action key
unbind C-b
set-option -g prefix C-t

# Switch panes
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R

# Resize panes
bind  -r C-k resize-pane -U 5
bind  -r C-j resize-pane -D 5
bind  -r C-h resize-pane -L 5
bind  -r C-l resize-pane -R 5

# Renumber windows to close gaps left by closed ones (0, 2, 5 -> 0, 1, 2):
# automatically whenever a window closes, or on demand with prefix+N
set -g renumber-windows on
bind-key N move-window -r \; display-message "Windows renumbered"

# Enabling the mouse mode
setw -g mouse on

# Run Tmux Plugin Manager
run '~/.tmux/plugins/tpm/tpm'

# Claude popup: one popup session per tmux session (keyed by its start dir,
# e.g. the LoanBud session -> loanbud-hq), with a window per directory running
# Claude in the current pane's dir. Bound after tpm to override the plugin's y.
#   prefix+y: open/reattach Claude for the current dir.
#   prefix+Y: same, but a new Claude starts with --resume.
bind-key y run-shell "$HOME/.config/tmux/claude-popup.sh '#{q:session_path}' '#{q:pane_current_path}' '#{q:window_id}'"
bind-key Y run-shell "$HOME/.config/tmux/claude-popup.sh '#{q:session_path}' '#{q:pane_current_path}' '#{q:window_id}' --resume"

# Reload config (R = uppercase, r = lowercase — both work)
bind-key R source-file ~/.tmux.conf \; display-message "Config successfully reloaded"
bind-key r source-file ~/.tmux.conf \; display-message "Config successfully reloaded"
